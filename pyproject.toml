[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timefence"
version = "1.0.0"
description = "Daily time budgets for websites and apps, for AdGuard Home."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sbhas2k" }]
keywords = ["adguard-home", "parental-controls", "screen-time", "dns", "self-hosted"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
]
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "itsdangerous==2.2.0",
  "argon2-cffi==25.1.0",
  "requests==2.34.2",
  "tzdata==2026.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "httpx2==2.16.0",
  "ruff==0.17.3",
  "pip-audit==2.10.1",
  "uv==0.13.9",
]

[project.scripts]
timefence = "timefence.__main__:main"

[project.urls]
Homepage = "https://github.com/sbhas2k/timefence-adguardhome"
Issues = "https://github.com/sbhas2k/timefence-adguardhome/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
timefence = ["templates/*.html", "static/*", "data/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
# UI copy is naturally long; wrapping it would hurt translatability.
"src/timefence/i18n.py" = ["E501"]
