# TimeFence + AdGuard Home in one compose project.
# Docs: https://github.com/sbhas2k/timefence-adguardhome/blob/main/docs/docker.md
# Example: TimeFence next to an official AdGuard Home container.
#
# 1. printf '%s' '<adguard-admin-password>' > adguard_password.txt
#    (the secret below; no .env file is read by this compose file).
# 2. docker compose up -d
# 3. open http://127.0.0.1:8099/ on the host and complete the first-run setup.
#    The port is bound to loopback and cookies are Secure, so a browser on
#    another machine needs the reverse proxy (docs/reverse-proxy.md).
#
# NOTE: AdGuard Home needs port 53, so it uses host networking below. If you
# already run AdGuard on the host, delete the adguardhome service and point
# ADGUARD_URL at it instead.

services:
  adguardhome:
    image: adguard/adguardhome:v0.107.80   # pin to the tag you run
    container_name: adguardhome
    network_mode: host
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    restart: unless-stopped

  timefence:
    image: ghcr.io/sbhas2k/timefence-adguardhome:latest
    container_name: timefence
    # The reconciler blocks every group on a clean stop; give it time to
    # finish that write before Docker sends SIGKILL.
    stop_grace_period: 45s
    environment:
      ADGUARD_URL: http://host.docker.internal:3000
      ADGUARD_USER: admin
      ADGUARD_PASSWORD_FILE: /run/secrets/adguard_password
      BASE_PATH: /
      # TZ: Europe/London      # optional: defaults to the host timezone
      LISTEN_HOST: 0.0.0.0      # bridge networking needs this; keep the port bound below
      LISTEN_PORT: "8099"
      DATA_DIR: /data
      SECURE_COOKIES: "true"   # set false only for plain-HTTP testing
      RECONCILE_INTERVAL: "30"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - timefence-data:/data
      # - /etc/localtime:/etc/localtime:ro   # follow the host timezone (this alone is enough)
    ports:
      - "127.0.0.1:8099:8099"
    secrets:
      - adguard_password
    restart: unless-stopped

secrets:
  adguard_password:
    file: ./adguard_password.txt

volumes:
  adguard-work:
  adguard-conf:
  timefence-data:
