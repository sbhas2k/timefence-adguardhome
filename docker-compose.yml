# Example: TimeFence next to an official AdGuard Home container.
#
# 1. cp .env.example .env and set ADGUARD_PASSWORD (or point
#    ADGUARD_PASSWORD_FILE at a file inside the container).
# 2. docker compose up -d
# 3. open http://<host>:8099/ and complete the first-run setup.
#
# NOTE: AdGuard Home needs port 53, so it uses host networking below. If you
# already run AdGuard on the host, delete the adguardhome service and point
# ADGUARD_URL at it instead.

services:
  adguardhome:
    image: adguard/adguardhome:v0.107.80   # pin to the tag you run
    container_name: adguardhome
    network_mode: host
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    restart: unless-stopped

  timefence:
    image: ghcr.io/sbhas2k/timefence-adguardhome:latest
    container_name: timefence
    stop_grace_period: 20s
    environment:
      ADGUARD_URL: http://host.docker.internal:3000
      ADGUARD_USER: admin
      ADGUARD_PASSWORD_FILE: /run/secrets/adguard_password
      BASE_PATH: /
      TZ: UTC                  # CHANGE ME: your IANA timezone, e.g. Europe/London
      LISTEN_HOST: 0.0.0.0      # bridge networking needs this; keep the port bound below
      LISTEN_PORT: "8099"
      DATA_DIR: /data
      SECURE_COOKIES: "true"   # set false only for plain-HTTP testing
      RECONCILE_INTERVAL: "30"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - timefence-data:/data
    ports:
      - "127.0.0.1:8099:8099"
    secrets:
      - adguard_password
    restart: unless-stopped

secrets:
  adguard_password:
    file: ./adguard_password.txt

volumes:
  adguard-work:
  adguard-conf:
  timefence-data:
