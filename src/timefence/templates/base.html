<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="{{ base }}/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ base }}/static/style.css">
</head>
<body data-base="{{ base }}" data-csrf="{{ csrf }}" data-page="{% block page %}{% endblock %}" data-version="{{ version }}">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">⏳</span> {{ app_name }}</div>
    <span class="spacer"></span>
    {% block topbar %}{% endblock %}
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">{{ unofficial }}</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
