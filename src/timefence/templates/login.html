{% extends "base.html" %}
{% block page %}login{% endblock %}
{% block title %}{{ t("login.heading") }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card">
    <h1 class="login-title">{{ app_name }}</h1>
    <p class="sub">{{ tagline }}</p>
    <form id="login-form" class="stack mt" autocomplete="on">
      <div>
        <label for="username">{{ t("login.username") }}</label>
        <input type="text" id="username" name="username" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div>
        <label for="password">{{ t("login.password") }}</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary wide" type="submit">{{ t("login.button") }}</button>
      <p class="alert bad hidden" id="login-error" role="alert"></p>
    </form>
    <p class="alert warn mt hidden" id="setup-hint">{{ t("login.setup_needed") }}</p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ base }}/static/auth.js"></script>{% endblock %}
