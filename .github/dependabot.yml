version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The app targets Python 3.12. Move the base image on purpose, after a test
      # run on the new version, not through an automatic pull request.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The CodeQL action refuses to mix versions in one workflow: every step
      # (init, analyze) must run the same version, so update them together.
      codeql-action:
        patterns: ["github/codeql-action"]
