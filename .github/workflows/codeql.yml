name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          # both are scanned: src/timefence/static holds hand-written JavaScript
          languages: python, javascript
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          # Code scanning results can only be uploaded from a public repository
          # (or one with GitHub Advanced Security). While the repository is private
          # the scan still runs and keeps its results as a downloadable artifact.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif-results
      - name: Keep the results while the repository is private
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 14

