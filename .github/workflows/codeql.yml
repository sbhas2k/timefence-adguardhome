name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9  # v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9  # v3
        with:
          # Code scanning results can only be uploaded from a public repository
          # (or one with GitHub Advanced Security). While the repository is private
          # the scan still runs and keeps its results as a downloadable artifact.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif-results
      - name: Keep the results while the repository is private
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 14

