# TimeFence behind nginx at https://example.com/timer/
# Put this inside the server { } block that terminates TLS.
#
# Important: no trailing slash on proxy_pass, because the app is prefix-aware
# (BASE_PATH=/timer) and expects to see the /timer prefix itself.
location = /timer {
    return 301 https://$host/timer/;
}

location /timer/ {
    proxy_pass http://127.0.0.1:8099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /timer;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 1m;
}
